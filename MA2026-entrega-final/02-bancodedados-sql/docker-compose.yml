# SQL Server Express da Etapa 5 (decisão 0002). A senha do sa vem do .env da raiz:
#   docker compose --env-file ../../.env up -d
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: cheiu-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?defina MSSQL_SA_PASSWORD no .env da raiz}
    ports:
      - "1433:1433"
    volumes:
      - cheiu-sql-dados:/var/opt/mssql
      - ./carga:/carga:ro
      - ./:/scripts:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
volumes:
  cheiu-sql-dados:
